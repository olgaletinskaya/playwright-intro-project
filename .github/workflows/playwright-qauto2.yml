name: Playwright Tests (qauto2)

on:
  push:
    branches: [ main, feature/fixtures-storage-state ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV_FILE: qauto2
      BASE_URL: https://qauto2.forstudy.space
      HTTP_USERNAME: guest
      HTTP_PASSWORD: welcome2qauto
      EMAIL: abbiesun806test+1@gmail.com
      PASSWORD: Password123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-qauto2
          path: playwright-report/
